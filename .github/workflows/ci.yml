name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=astroassist
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: if [ -f frontend/package.json ]; then cd frontend && npm ci && npm run lint && npm run build; else echo "frontend not scaffolded yet"; fi
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync --extra dev
      - run: if [ -f frontend/package.json ]; then cd frontend && npm ci && npx playwright install --with-deps chromium && npx vitest run && npx playwright test; else echo "frontend not scaffolded yet"; fi
        env: { ASTROASSIST_MODEL_PROFILE: mock }
