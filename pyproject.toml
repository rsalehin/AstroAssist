[project]
name = "astroassist"
version = "0.0.1"
description = "A locally-run, multi-agent research workbench for astronomers with mandatory provenance and reproducible exports."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "A M Rafiqus Salehin (Abir)" }]
keywords = ["astronomy", "astrophysics", "astropy", "astroquery", "langgraph", "research-assistant"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=6.1",
  "astroquery>=0.4.7",
  "pyvo>=1.5",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "lightkurve>=2.4",
  "astroplan>=0.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langsmith>=0.1",
  "langchain-anthropic>=0.2",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "duckdb>=1.0",
  "pyarrow>=16",
  "sqlalchemy>=2.0",
  "sqlmodel>=0.0.21",
  "keyring>=25",
  "jupyter-client>=8.6",
  "ipykernel>=6.29",
  "httpx>=0.27",
  "tenacity>=8.3",
  "python-ulid>=2.7",
  "typer>=0.12",
  "structlog>=24",
  "pyyaml>=6",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
interactive = ["plotly>=5.22"]
timeseries = []
spectroscopy = ["specutils>=1.15"]
imaging = ["photutils>=1.12", "reproject>=0.13", "regions>=0.9", "healpy>=1.16; sys_platform != 'win32'"]
dynamics = ["gala>=1.8", "galpy>=1.9"]
sampling = ["emcee>=3.1", "dynesty>=2.1", "corner>=2.2"]
radio = ["spectral-cube>=0.6", "radio-beam>=0.3"]
solar = ["sunpy>=5.1"]
literature-local = ["FlagEmbedding>=1.2", "rank-bm25>=0.2", "sentence-transformers>=3"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "pytest-recording>=0.13", "pytest-cov>=5",
  "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML", "httpx",
  "mkdocs-material>=9.5",
]
all = ["astroassist[interactive,spectroscopy,imaging,dynamics,sampling,radio,solar]"]

[project.scripts]
astroassist = "astroassist.cli:app"

[project.urls]
Homepage = "https://github.com/rsalehin/AstroAssist"
Issues = "https://github.com/rsalehin/AstroAssist/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astroassist"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Do not touch Markdown: ruff reformats fenced Python code blocks, which would rewrite the
# canonical spec docs. Docs are prose + illustrative snippets, not linted source.
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
# 3.12 so mypy can parse modern dependency stubs (numpy uses PEP 695 `type` aliases).
# Runtime support for 3.11 is enforced by the CI pytest matrix; ruff target stays py311.
python_version = "3.12"
strict = true
files = ["src/astroassist/core"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: tests that call live external services (deselected by default)",
  "benchmark: astronomy benchmark questions",
]
addopts = "-m 'not live and not benchmark'"
